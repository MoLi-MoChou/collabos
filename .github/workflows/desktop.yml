name: desktop
on:
  push:
    branches: [main]
    paths: ["desktop/**", "server/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "server/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:
    inputs:
      server_url:
        description: Default server URL baked into the app
        default: http://38.76.166.121:8190

jobs:
  windows:
    runs-on: windows-latest
    env:
      COLLABOS_DEFAULT_SERVER: ${{ inputs.server_url || 'http://38.76.166.121:8190' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: daemon tests on Windows
        working-directory: server
        run: go test ./internal/daemon/... ./pkg/...
      - name: build collab.exe sidecar
        working-directory: server
        shell: bash
        run: CGO_ENABLED=0 go build -o ../desktop/src-tauri/binaries/collab-x86_64-pc-windows-msvc.exe ./cmd/collab
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: desktop unit tests
        working-directory: desktop/src-tauri
        run: cargo test
      - name: build installers
        working-directory: desktop
        run: npx -y @tauri-apps/cli@2 build
      - uses: actions/upload-artifact@v4
        with:
          name: collabos-windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/binaries/collab-x86_64-pc-windows-msvc.exe
