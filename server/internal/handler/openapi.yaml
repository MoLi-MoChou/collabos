openapi: 3.1.0
info:
  title: CollabOS API
  version: "0.4.0"
  description: |
    Open API for CollabOS (PRD V0.4 §open API). Authenticate with an access token
    from /api/auth/dev-login (rotated via /api/auth/refresh) or a personal API token
    (coa_…) created at POST /api/tokens. Workspace-scoped routes need the X-Workspace-ID header.
    Every route is also served under /api/v1. Errors are {"error":{"code","message"}}.
servers:
  - url: /api
  - url: /api/v1
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    Workspace:
      name: X-Workspace-ID
      in: header
      required: true
      schema: {type: string, format: uuid}
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: {type: string}
            message: {type: string}
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
security:
  - bearer: []
paths:
  /api/agents:
    get:
      operationId: listAgents
      tags: [agents]
      parameters:
        - $ref: "#/components/parameters/Workspace"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: object}
        default: {$ref: "#/components/responses/Error"}
  /api/agents/{id}/intake:
    patch:
      operationId: updateIntake
      tags: [agents]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
